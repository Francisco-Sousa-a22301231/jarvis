[project]
name = "jarvis"
version = "0.1.0"
description = "Voice-driven AI assistant orchestrator that uses Claude Code"
requires-python = ">=3.11"
authors = [{ name = "Francisco Sousa" }]
dependencies = [
    "openwakeword>=0.6.0",
    "pvporcupine>=3.0.2",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    # webrtcvad imports pkg_resources, which setuptools 81+ removed. Pin
    # until either webrtcvad gets fixed or we switch VAD libraries.
    "setuptools<81",
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "elevenlabs>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]
gmail = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
