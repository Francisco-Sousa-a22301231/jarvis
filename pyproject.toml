[project]
name = "jarvis"
version = "0.1.0"
description = "Voice-driven AI assistant orchestrator that uses Claude Code"
requires-python = ">=3.11"
authors = [{ name = "Francisco Sousa" }]
dependencies = [
    "pvporcupine>=3.0.2",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10",
    "faster-whisper>=1.0.0",
    "numpy>=1.24",
    "anthropic>=0.40.0",
    "elevenlabs>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
