# Copy to ~/.jarvis/config.toml and fill in.
# Environment variables (PICOVOICE_KEY, ELEVENLABS_KEY) override file values.

log_level = "INFO"

[picovoice]
# Free key: https://console.picovoice.ai/
# Built-in "jarvis" wake word — no custom model needed.
access_key = "YOUR_PICOVOICE_KEY"

[whisper]
# tiny.en (fastest, less accurate) | base.en (sweet spot on 2019 Intel Mac) | small.en
model = "base.en"
# CPU is the only safe option on Intel Mac. Apple Silicon could use "auto".
device = "cpu"
compute_type = "int8"

[elevenlabs]
# Optional. If unset, falls back to macOS `say` (free, OK quality).
# Key: https://elevenlabs.io/app/settings/api-keys
# api_key = "YOUR_ELEVENLABS_KEY"
# voice_id = "EXAVITQu4vr4xnSDxMaL"  # Bella
# model = "eleven_turbo_v2_5"

[coder]
# Project the voice commands operate on (Phase 1 = single project).
# Phase 2 will add multi-project routing via Haiku dispatcher.
default_project = "~/StudioProjects/MyLessons-Project"

# Claude Code CLI binary. Override if not on PATH.
claude_bin = "claude"

# DANGEROUS: skip all permission prompts inside Claude Code.
# Required for daemon mode (no human at the keyboard).
# Only enable once you trust the prompts your daemon is feeding it.
dangerously_skip_permissions = false

# Max time a single Claude Code task can run (seconds).
timeout_seconds = 600

[vad]
# webrtcvad aggressiveness: 0 (least) – 3 (most). 2 is good for desk mics.
aggressiveness = 2
# Seconds of silence after speech before we stop recording.
silence_seconds = 1.0
# Hard cap on a single utterance.
max_utterance_seconds = 30.0

# ─── Phase 2 ──────────────────────────────────────────────────────────────
# Phase 2 adds a Haiku router + Trello / Calendar / Mail / Brief agents.
# These read credentials from environment variables (NOT this file).
#
# LLM calls go through the `claude` CLI (your Claude Max subscription) —
# NO Anthropic API key is needed. Make sure `claude` is installed and
# you're logged in via `claude login`.
#
# Optional, for the Trello agent (auto-disables if absent):
#   TRELLO_KEY=...
#   TRELLO_TOKEN=...
#   TRELLO_BOARD_ID=...
#
# Calendar + Mail agents are macOS-only (AppleScript). Grant Automation
# permission to Calendar / Mail when prompted on first use.

# ─── Phase 3 ──────────────────────────────────────────────────────────────
# QA tester agent. Reads <default_project>/.jarvis-qa-spec.md and drives a
# browser via the Playwright MCP server.

[qa]
# Path to an MCP config that registers a Playwright server. See
# mcp_config.example.json in the repo for the format.
mcp_config = "~/.jarvis/mcp.json"

# ─── Phase 4 ──────────────────────────────────────────────────────────────
# Mail backend selector. The router skill `mail` routes to whichever this
# picks.
#   - "applescript" (default): macOS Mail.app via osascript. Zero setup,
#     macOS-only, requires Mail.app to be running and granted Automation
#     permission on first use.
#   - "gmail": Google Gmail API via OAuth. Cross-platform but one-time setup.
#     See README → Phase 4 Gmail setup.
[mail]
backend = "applescript"
# gmail_credentials = "~/.jarvis/gmail-credentials.json"
# gmail_token = "~/.jarvis/gmail-token.json"
# contacts = "~/.jarvis/contacts.toml"   # for the mail_send skill

# Memory and confirmation gate are wired in automatically — no config needed.
# Memory lives at ~/.jarvis/memory/recent.md (last 10 utterances).
# Confirmation is required for skills with requires_confirm=True in
# src/jarvis/skills.py (currently: trello_create, mail_send).

# ─── Phase 5 ──────────────────────────────────────────────────────────────
# Multi-project routing. Voice utterances like "in mylessons add a dark
# mode toggle" route the coder skill to the named project. The first
# project here is the default when no project is named.
#
# If you omit this array, Jarvis falls back to a single project built
# from `coder.default_project` — existing configs keep working.
#
# [[projects]]
# name = "mylessons"
# path = "~/StudioProjects/MyLessons-Project"
# aliases = ["my lessons", "lessons"]
#
# [[projects]]
# name = "jarvis"
# path = "~/StudioProjects/jarvis"
# aliases = []

# Proactive watcher. Polled by launchd (see com.francisco.jarvis-watcher.plist).
# Posts a macOS notification when an unread message arrives from someone
# in the VIP list. Requires [mail].backend = "gmail".
[watcher]
vip_senders = []
# vip_senders = ["boss@company.com", "important@client.com"]
# Notify for calendar events starting within N minutes. 0 disables.
calendar_lead_minutes = 0
# Notify when a card lands in this Trello list (name match, case-insensitive).
# Empty string disables.
trello_list = ""

# ─── Phase 6 ──────────────────────────────────────────────────────────────
# Drop .py files into this directory to register custom skills at startup.
# Each file must define ID, DESCRIPTION, execute(task: str) -> str.
# See examples/skills/weather.py in the repo for a template.
[skills]
dir = "~/.jarvis/skills"

# HTTP server for remote commands (phone-as-remote / iOS Shortcuts).
# Default: localhost-only. To expose on LAN, set host = "0.0.0.0" and
# reach it via Tailscale from your phone.
#
# A bearer token is required. Set via JARVIS_SERVER_TOKEN env var (preferred)
# or `token = "..."` here (less safe — keep this file out of git).
[server]
host = "127.0.0.1"
port = 8765
# token = "your-long-random-string"
